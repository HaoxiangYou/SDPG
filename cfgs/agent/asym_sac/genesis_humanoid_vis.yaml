# Asymmetric SAC (visual RL baseline of arXiv:2412.13662, Pinto et al. 2017 idea):
# actor on 84x84 stacked RGB, twin Q critics on privileged state.
# Hyperparameters follow Table 5 (DMControl) of arXiv:2412.13662, which covers
# Humanoid-Walk: lr 3e-4, batch 512, discount 0.99, update-to-data ratio 0.25,
# replay buffer 500k, autotuned entropy. Env-step budget ~4M (paper Fig. 4).
name: asym_sac

config:

  model:
    actor:
      # List of input sources, each with name, encoder, and RMS normalization flag
      inputs:
        - name: RGB
          encoder:
            type: drqv2
            network:
              # paper uses a 256-d feature with LayerNorm after the CNN
              output_dim: 256
          apply_rms: false

      # Policy head processes encoded features into a tanh-squashed Gaussian
      policy_head:
        type: mlp
        network:
          units: [512, 256]
          activation: elu
        fixed_std: false
        # SAC uses a state-dependent std (mean and log_std heads)
        state_dependent_std: true
        log_std_init: -1.0

    critic:
      # Asymmetric: critic consumes the privileged state only (plus the action internally)
      inputs:
        - name: privileged_observations
          encoder: null  # null = pass-through (no encoding)
          apply_rms: true
      # Twin Q networks built from these units (input = state + action, output = scalar Q)
      value_head:
        type: mlp
        network:
          units: [512, 256]
          activation: elu

  num_envs: 64

  # Env steps counted with action repeat (num_envs * action_repeat per iteration);
  # paper trains Humanoid-Walk for ~4M env steps
  total_env_steps: 4000000
  action_repeat: 2
  # Random uniform actions until this many env steps (seeding the replay buffer)
  num_seed_steps: 8000

  # Discount factor
  gamma: 0.99
  reward_scale: 1.0

  # SAC update
  batch_size: 512
  lr: 3e-4
  # Gradient updates per env step (paper: 0.25); with 64 envs * action repeat 2
  # this gives 32 updates per iteration. Set updates_per_iter to override.
  utd_ratio: 0.25
  updates_per_iter: null
  critic_tau: 0.005
  # Entropy temperature (autotuned towards target_entropy = -num_actions)
  init_temperature: 0.1
  log_std_bounds: [-5, 2]

  # Replay buffer (transitions; paper value for DMControl)
  replay_buffer_size: 500000
  buffer_device: cpu

  truncate_grads: false
  grad_norm: 10.0

  # Logging / checkpoints (in iterations)
  log_interval: 25
  save_frequency: 2000
